# Local PostgreSQL for development. The password comes from .env (see scripts/init-env.sh).
services:
  postgres:
    image: postgres:17-alpine
    container_name: research-trade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: research_trade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      POSTGRES_DB: research_trade
    ports:
      # Bound to localhost only: the database is never exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_trade -d research_trade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
